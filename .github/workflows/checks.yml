name: Checks
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stoku_test
          POSTGRES_USER: stoku_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoku_test -d stoku_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STOKU_TEST_POSTGRES: ${{ matrix.database == 'pgsql' && '1' || '0' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, sqlite3, mbstring, intl, zip, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/phpunit
